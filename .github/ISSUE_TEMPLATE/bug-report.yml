name: Report a catalogue or installation problem
description: Report an inaccurate entry, broken source, export error, or website bug.
title: '[Bug] '
labels: []
body:
  - type: input
    id: entry
    attributes:
      label: Entry ID or affected page
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and observed behavior
      description: Include expected behavior and relevant version details.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe reproduction evidence
      description: Use synthetic input. Remove credentials, account identifiers, and private content.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no credentials or private conversation/memory data.
          required: true
