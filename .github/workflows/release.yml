name: Release catalogue

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'Harzva/awesome-bot' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Preserve template versions from earlier release tags
        run: node scripts/check-versions.mjs --ci
      - name: Require tag and package version to agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const p=require("./package.json");if(process.env.RELEASE_TAG!==`v${p.version}`)process.exit(1)'
      - run: npm run check
      - run: npm test
      - run: npm run build:site
      - run: npm run audit:public
      - run: npm run pack:release
      - name: Publish versioned files and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Published assets are immutable; create a new version.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/release/* --verify-tag --title "Awesome Bot $RELEASE_TAG" --notes-file dist/release/RELEASE_NOTES.md
